<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Signup</title>
    <link rel="icon" href="../assets/icons/join-logo.svg" />
    <!-- signup links -->

    <link rel="stylesheet" href="../css/reset-stylesheet.css" />
    <link rel="stylesheet" href="../css/dpf-flex-utils.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/assets.css" />
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../style.css" />

    <script type="module" src="../js/firebase-init.js"></script>
    <script defer src="../script.js"></script>
    <script src="../js/auth-service.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="../js/signup-validation.js" defer></script>
    <script src="../js/signup.js" defer></script>
  </head>
  <body class="dpf-center body-signup loading-animation">
    <section class="app dpf-column-spc-between-center">
      <header class="header-signup">
        <div class="dpf-flex-start">
          <img src="../assets/icons/join-logo.svg" alt="" />
        </div>
      </header>
      <main class="main-signup">
        <form class="dpf-column-spc-between-center" id="signupForm" novalidate>
          <div>
            <a href="../index.html" class="signup-back-vector dpf-center">
              <img src="../assets/icons/go-back-icon.svg" alt="go back" />
            </a>
            <div class="heading-accent heading-accent--bottom-center">
              <h1>Sign up</h1>
            </div>
          </div>

          <div class="pb-1 dpf-flex-column-center input-bar">
            <p id="signupHint" class="hint-text">
              All fields are required to create an account.
            </p>
            <label for="registerName" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="text"
                placeholder="Name"
                class="form-control"
                id="registerName"
                maxlength="20"
              />
              <img
                src="../assets/icons/login-person.svg"
                class="input-icon"
                alt=""
              />
            </div>
            <label for="registerEmail" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="email"
                placeholder="Email"
                class="form-control"
                id="registerEmail"
                maxlength="254"
              />
              <img src="../assets/icons/mail.svg" class="input-icon" alt="" />
            </div>
            <label for="registerPassword" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="password"
                placeholder="Password"
                class="form-control"
                id="registerPassword"
                maxlength="64"
              />
              <img
                src="../assets/icons/lock.svg"
                id="visibility-icon-password"
                class="input-icon"
                alt=""
              />
            </div>
            <label for="registerConfirmPassword" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="password"
                placeholder="Confirm Password"
                class="form-control"
                id="registerConfirmPassword"
                maxlength="64"
              />
              <img
                src="../assets/icons/lock.svg"
                id="visibility-icon-confirm"
                class="input-icon"
                alt=""
              />
            </div>
            <p id="signupError" class="error-text"></p>
          </div>
          <section class="dpf-column-spc-between-center">
            <div class="form-check" id="privacyCheckField">
              <input
                type="checkbox"
                class="form-check-input"
                id="privacyCheck"
              />
              <label class="form-check-label" for="privacyCheck">
                I accept the
                <a
                  href="./privacy-policy.html"
                  target="_blank"
                  class="privacy-link"
                  >Privacy Policy</a
                >
              </label>
            </div>

            <div class="dpf-column-spc-between-center">
              <button
                type="submit"
                class="button-basic button-primary"
                id="signup"
              >
                Sign up
              </button>
            </div>
          </section>
        </form>
      </main>
      <div class="toast-message" id="toast-message" popover="manual"></div>

      <footer class="dpf-flex-column-center footer-signup">
        <section class="dpf-center impress-bar">
          <a href="./privacy-policy.html" class="signup-a">Privacy Policy</a>
          <a href="./imprint.html" class="signup-a">Legal Notice</a>
        </section>
      </footer>
    </section>
  </body>
</html>
