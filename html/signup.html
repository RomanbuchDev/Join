<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Signup</title>
    <link rel="icon" href="../assets/icons/join-logo.svg" />
    <!-- login links -->

    <link rel="stylesheet" href="../css/reset_stylesheet.css" />
    <link rel="stylesheet" href="../css/dpf-flex-utils.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../style.css" />

    <script src="../script.js" defer></script>
    <script src="../js/template.js" defer></script>
    <script src="../js/signup.js" defer></script>
  </head>
  <body class="dpf-center body-signup">
    <section class="app dpf-column-spc-between-center">
      <header class="header-signup">
        <div class="dpf-flex-start">
          <img src="../assets/icons/join-logo.svg" alt="" />
        </div>
      </header>
      <main class="main-signup">
        <form class="dpf-column-spc-between-center" id="signupForm">
          <div>
            <a href="../index.html" class="signup-back-vector dpf-center">
              <img src="../assets/icons/login-back-Vector.svg" alt="Zurück" />
            </a>
            <div class="heading-accent heading-accent--bottom-center">
              <h1>Sign up</h1>
            </div>
          </div>

          <div class="pb-1 dpf-flex-column-center input-bar">
            <label for="registerName" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="text"
                placeholder="Name"
                class="form-control"
                id="registerName"
              />
              <img
                src="../assets/icons/login-person.svg"
                class="input-icon"
                alt=""
              />
            </div>
            <label for="registerEmail" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="email"
                placeholder="Email"
                class="form-control"
                id="registerEmail"
              />
              <img src="../assets/icons/mail.svg" class="input-icon" alt="" />
            </div>
            <label for="registerPassword" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="password"
                placeholder="Password"
                class="form-control"
                id="registerPassword"
              />
              <img
                src="../assets/icons/lock.svg"
                id="visibility-icon-password"
                class="input-icon"
                alt=""
              />
            </div>
            <label for="registerConfirmPassword" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="password"
                placeholder="Confirm Password"
                class="form-control"
                id="registerConfirmPassword"
              />
              <img
                src="../assets/icons/lock.svg"
                id="visibility-icon-confirm"
                class="input-icon"
                alt=""
              />
            </div>
            <p id="signupError" class="error-text"></p>
          </div>
          <section class="dpf-column-spc-between-center">
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="privacyCheck"
              />
              <label class="form-check-label" for="privacyCheck">
                I accept the
                <a href="./privacy-policy.html" target="_blank" class="signup-a"
                  >Privacy policy</a
                >
              </label>
            </div>

            <div class="dpf-column-spc-between-center">
              <button type="submit" class="btn btn-primary" id="signup">
                Sign up
              </button>
            </div>
          </section>
        </form>
      </main>
      <div id="signupToast" class="toast">You Signed Up successfully</div>

      <footer class="dpf-flex-column-center footer-signup">
        <section class="dpf-center impress-bar">
          <a href="./privacy-policy.html" target="_blank" class="signup-a"
            >Privacy Policy</a
          >
          <a href="./imprint.html" target="_blank" class="signup-a"
            >Legal notice</a
          >
        </section>
      </footer>
    </section>
  </body>
</html>
