<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="images/" href="/assets/icons/join-logo.svg" />
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../css/reset_stylesheet.css" />
    <link rel="stylesheet" href="../css/summary.css" />
    <link rel="stylesheet" href="../style.css" />
    <title>Join</title>
  </head>
  <body>
    <header class="main-header">
      <a href=""><img src="/assets/icons/join-logo.svg" alt="Join Logo" /></a>

      <button class="user-avatar"><span>SM</span></button>
    </header>
    <main>
      <section>
        <header class="summary-header">
          <h1>Join 360</h1>
          <p>Key Metrics at a Glance</p>
        </header>

        <ul class="summery-list">
          <li class="summary-card summary-card--todo">
            <img src="/assets/icons/todo-icon.svg" alt="" />
            <span>1</span>
            <span>To-Do</span>
          </li>
          <li class="summary-card summary-card--done">
            <img src="/assets/icons/done-icon.svg" alt="" />
            <span>1</span>
            <span>Done</span>
          </li>
          <li class="summary-card summary-card--urgent">
            <img src="/assets/icons/urgent-icon.svg" alt="" />
            <span>1</span>
            <span>Urgent</span>

            <time datetime="2026-10-16">October 16, 2022</time>
            <span>Upcoming Deadline</span>
          </li>
          <li class="summary-card summary-card--board">
            <span>5</span>
            <span>Task in Board</span>
          </li>
          <li class="summary-card summary-card--progress">
            <span>2</span>
            <span>Task in Progress</span>
          </li>
          <li class="summary-card summary-card--feedback">
            <span>2</span>
            <span>Awaiting feedback</span>
          </li>
        </ul>
      </section>
    </main>

    <nav class="main-nav">
      <ul class="main-nav-list">
        <li class="main-nav-item">
          <a href="/html/summary.html">
            <img src="/assets/icons/summary-icon.svg" alt="" />
            <span>Summary</span>
          </a>
        </li>
        <li class="main-nav-item">
          <a href="/html/add-task.html">
            <img src="/assets/icons/addtask-icon.svg" alt="" />
            <span> Add Task </span>
          </a>
        </li>
        <li class="main-nav-item">
          <a href="/html/board.html">
            <img src="/assets/icons/board-icon.svg" alt="" />
            <span> Board </span>
          </a>
        </li>
        <li class="main-nav-item">
          <a href="/html/contact.html">
            <img src="/assets/icons/contact-icon.svg" alt="" />
            <span> Contacts </span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
