<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/icons/join-logo.svg"
    />
    <link rel="stylesheet" href="../css/reset_stylesheet.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/board.css" />
    <link rel="stylesheet" href="../style.css" />
    <title>Join - Board</title>
  </head>

  <body>
    <header class="main-header">
      <a href="./summary.html">
        <img src="../assets/icons/join-logo.svg" alt="to the summary page" />
      </a>
      <button type="button" class="user-avatar"><span>G</span></button>
    </header>

    <main>
      <section class="h1-find-section margin-left-right d-flex">
        <section class="h1-container d-flex">
          <h1>Board</h1>
          <button class="button-reset" type="button" aria-label="Add new task">
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              viewBox="0 0 40 40"
              class="fill-svg-button"
            >
              <rect width="40" height="40" rx="10" />
              <path
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                d="M20 10V30"
              />
              <path
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                d="M30 20L10.0005 20.138"
              />
            </svg>
          </button>
        </section>
        <section class="find-task-container d-flex">
          <div class="find-task-inputfield">
            <input type="text" placeholder="Find Task" />
            <button class="button-reset" type="button" aria-label="Find tasks">
              <svg
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 18 18"
                class="fill-svg-button"
              >
                <path
                  d="M6.50185 13.0037C4.68467 13.0037 3.14673 12.3744 1.88804 11.1157C0.629346 9.85697 0 8.31903 0 6.50185C0 4.68467 0.629346 3.14673 1.88804 1.88804C3.14673 0.629346 4.68467 0 6.50185 0C8.31903 0 9.85697 0.629346 11.1157 1.88804C12.3744 3.14673 13.0037 4.68467 13.0037 6.50185C13.0037 7.23539 12.887 7.92725 12.6536 8.57744C12.4202 9.22762 12.1034 9.80279 11.7033 10.3029L17.3049 15.9045C17.4883 16.0879 17.58 16.3213 17.58 16.6047C17.58 16.8881 17.4883 17.1215 17.3049 17.3049C17.1215 17.4883 16.8881 17.58 16.6047 17.58C16.3213 17.58 16.0879 17.4883 15.9045 17.3049L10.3029 11.7033C9.80279 12.1034 9.22762 12.4202 8.57744 12.6536C7.92725 12.887 7.23539 13.0037 6.50185 13.0037ZM6.50185 11.0031C7.7522 11.0031 8.81501 10.5655 9.69026 9.69026C10.5655 8.81501 11.0031 7.7522 11.0031 6.50185C11.0031 5.25149 10.5655 4.18869 9.69026 3.31344C8.81501 2.43819 7.7522 2.00057 6.50185 2.00057C5.25149 2.00057 4.18869 2.43819 3.31344 3.31344C2.43819 4.18869 2.00057 5.25149 2.00057 6.50185C2.00057 7.7522 2.43819 8.81501 3.31344 9.69026C4.18869 10.5655 5.25149 11.0031 6.50185 11.0031Z"
                />
              </svg>
            </button>
          </div>
          <button class="d-desktop" type="button">Add task</button>
        </section>
      </section>
      <section>
        <div>
          <h2>To Do</h2>
          <button class="button-reset" type="button" aria-label="Add new task">
            <svg
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              viewBox="0 0 30 30"
              class="fill-svg-button"
            >
              <rect width="30" height="30" rx="10" />
              <rect
                x="2"
                y="2"
                width="26"
                height="26"
                rx="8"
                fill="rgba(246 247 248 / 100%)"
              />
              <rect x="14" y="6.5" width="2" height="17" rx="1" />
              <rect x="6.5" y="14.1416" width="17" height="2" rx="1" />
            </svg>
          </button>
        </div>
        <div>
          <p>label</p>
          <h3>Task 1</h3>
          <p>
            Task description, Task description, Task description, Task
            description
          </p>
          <div>
            <progress value="50" max="100"></progress>
            <p>0/2 Subtasks</p>
          </div>
          <div>
            <div>
              <span>AB</span>
              <span>CD</span>
              <span>EF</span>
            </div>
            <img
              src="../assets/icons/prio-urgent-symbol.svg"
              alt="urgent task"
            />
          </div>
        </div>
        <div>
          <h3>Task 2</h3>
          <p>Task description</p>
        </div>
      </section>
      <section>
        <h2>In Progress</h2>
      </section>
      <section>
        <h2>Await feedback</h2>
      </section>
      <section>
        <h2>Done</h2>
      </section>
    </main>

    <nav class="main-nav">
      <ul class="main-nav-list">
        <li class="main-nav-item">
          <a href="./summary.html">
            <img
              src="../assets/icons/summary-icon.svg"
              alt="to the summary page"
            />
            <span>Summary</span>
          </a>
        </li>

        <li class="main-nav-item">
          <a href="./add-task.html">
            <img
              src="../assets/icons/addtask-icon.svg"
              alt="to add a new task"
            />
            <span> Add Task </span>
          </a>
        </li>

        <li class="main-nav-item">
          <a href="./board.html" aria-current="page">
            <img src="../assets/icons/board-icon.svg" alt="to the board page" />
            <span> Board </span>
          </a>
        </li>

        <li class="main-nav-item">
          <a href="./contact.html">
            <img
              src="../assets/icons/contact-icon.svg"
              alt="to the contacts page"
            />
            <span> Contacts </span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
