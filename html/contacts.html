  <!-- Dialog window to add contact -->
  <dialog class="add-contact-container" id="contacts-dialog">
    <form>
      <!-- Dialog header -->
      <header class="add-contact-header-container" aria-labelledby="dialog title">
        <div class="close-button-container">
          <button type="button" class="close-button" onclick="closeDialog()">
            &times;
          </button>
        </div>
        <div class="add-contact-title-container">
          <img src="../assets/icons/contacts/join-logo-white-letters.svg" alt="Join logo" class="dialog-join-icon" />
          <span class="add-contact-title" id="dialog-title">Add contact</span>
          <span class="add-contact-subtitle" id="dialog-subtitle">Tasks are better with a team!</span>
        </div>
        <div class="add-contact-shortcut" id="dialog-shortcut">
          <img src="../assets/icons/contacts/person_icon.png" alt="Contacts icon" />
        </div>
      </header>

      <!-- Dialog main -->
      <div class="add-contact-main-container">
        <div class="add-contact-input">
          <input type="text" placeholder="Name" id="input-contact-name-dialog" required />
          <img src="../assets/icons/contacts/person_icon_input.png" alt="Person input icon" />
        </div>

        <div class="add-contact-input">
          <input type="email" placeholder="Email" id="input-contact-email-dialog" />
          <img src="../assets/icons/contacts/email_icon_input.png" alt="Email input icon" />
        </div>

        <div class="add-contact-input">
          <input type="tel" placeholder="Phone" id="input-contact-phone-dialog" pattern="[0-9\s+]*"
            title="Please enter only numbers from 0 to 9 and the plus symbol." />
          <img src="../assets/icons/contacts/phone_icon_input.png" alt="Phone input icon" />
        </div>
      </div>

      <!-- Dialog footer -->
      <footer class="add-contact-footer">
        <!-- Cancel button -->
        <button type="button" class="button-secondary delete-contact-data" id="dialog-cancel-button"
          onclick="closeDialog()">
          <span>Cancel</span>
          <span class="close-button">&times;</span>
        </button>
        <!-- Create contact button -->
        <button type="submit" class="button-primary" id="dialog-create-contact-button">
          Create contact
          <img src="../assets/icons/contacts/check_icon.png" alt="Check icon" />
        </button>
        <!-- Delete button -->
        <button type="button" class="button-secondary delete-contact-data hidden" id="dialog-delete-button"
          onclick="openDialogDeleteQuestion()">
          Delete
        </button>
        <!-- Save button -->
        <button type="submit" class="button-primary save-contact-data hidden" id="dialog-save-button">
          Save
          <img src="../assets/icons/contacts/check_icon.png" alt="Save icon" />
        </button>
      </footer>
    </form>
  </dialog>

  <!-- Dialog for delete contact question -->
  <dialog class="delete-question-container" id="delete-question-dialog">
    <form method="dialog">
      <h4>Delete contact</h4>
      <p>Do you really want to delete this contact?</p>
      <div class="delete-question-button-container">
        <!-- Delete contact - No button -->
        <button type="button" class="button-secondary delete-question-no" id="delete-question-no-button"
          onclick="closeContactDeletion()">
          NO
        </button>
        <!-- Delete contact - Yes button -->
        <button type="submit" class="button-primary delete-question-yes" id="delete-question-yes-button"
          onclick="deleteContact()" autofocus>
          YES
        </button>
      </div>
    </form>
  </dialog>

  <!-- Dialog toast message - Contact successfully created -->
  <div class="toast-message toast-contact-created" id="toast-message-contact-created">
    Contact successfully created
  </div>

  <!-- Dialog toast message - Contact successfully edited -->
  <div class="toast-message toast-contact-edited" id="toast-message-contact-edited">
    Contact successfully edited
  </div>

  <!-- Dialog toast message - Contact successfully deleted -->
  <div class="toast-message toast-contact-deleted" id="toast-message-contact-deleted">
    Contact successfully deleted
  </div>
