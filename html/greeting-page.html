<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/icons/join-logo.svg" />
    <link rel="stylesheet" href="../css/reset-stylesheet.css" />
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/dpf-flex-utils.css" />
    <link rel="stylesheet" href="../css/greeting-page.css" />
    <link rel="stylesheet" href="../style.css" />

    <script type="module" src="../js/firebase-init.js"></script>
    <script defer src="../script.js"></script>
    <script src="../js/login-status.js" defer></script>
    <script src="../js/toggle-user-menu.js" defer></script>
    <script src="../js/header-footer.js" defer></script>
    <script src="../js/greeting-page.js" defer></script>
    <title>Join - Greeting</title>
  </head>
  <body onload="initGreeting()">
    <div id="page">
      <header class="main-header">
        <a class="main-header-logo" href="./summary.html"
          ><img src="../assets/icons/join-logo.svg" alt="Join Logo"
        /></a>

        <p class="main-header-title">Kanban Project Management Tool</p>

        <a
          href="./help.html"
          class="main-header-help"
          aria-label="Link to Help page"
        >
          <img src="../assets/icons/help.svg" alt="" />
        </a>

        <div class="user-menu">
          <button
            type="button"
            class="user-avatar"
            onclick="toggleUserMenu(this)"
            aria-expanded="false"
            aria-controls="user-menu-dropdown"
            aria-label="Open user menu"
          >
            <span id="avatarShortcut"></span>
          </button>

          <ul id="user-menu-dropdown" class="user-menu-dropdown">
            <li class="user-menu-item user-menu-item--help">
              <a href="./help.html">Help</a>
            </li>
            <li class="user-menu-item">
              <a href="./imprint.html">Legal Notice</a>
            </li>
            <li class="user-menu-item">
              <a href="./privacy-policy.html">Privacy Policy</a>
            </li>
            <li class="user-menu-item user-menu-item--logout">
              <button type="button" class="user-menu-logout">Log out</button>
            </li>
          </ul>
        </div>
      </header>
      <main class="main main-greeting dpf-center">
        <section class="dpf-flex-column-center greeting-content">
          <p id="greetingMessage" class="greeting-text"></p>
          <p id="userName" class="greeting-user"></p>
        </section>
      </main>

      <nav class="main-nav">
        <img
          class="nav-join-img"
          src="../assets/icons/join-logo-white.svg"
          alt=""
        />
        <ul class="main-nav-list">
          <li class="main-nav-item">
            <a href="../html/summary.html" aria-current="page">
              <img src="../assets/icons/summary-icon.svg" alt="" />
              <span>Summary</span>
            </a>
          </li>

          <li class="main-nav-item">
            <a href="../html/add-task.html">
              <img src="../assets/icons/addtask-icon.svg" alt="" />
              <span> Add Task </span>
            </a>
          </li>

          <li class="main-nav-item">
            <a href="../html/board.html">
              <img src="../assets/icons/board-icon.svg" alt="" />
              <span> Board </span>
            </a>
          </li>

          <li class="main-nav-item">
            <a href="../html/contacts.html">
              <img src="../assets/icons/contact-icon.svg" alt="" />
              <span> Contacts </span>
            </a>
          </li>
        </ul>

        <ul class="main-nav-legal">
          <li>
            <a href="../html/privacy-policy.html">Privacy Policy</a>
          </li>

          <li>
            <a href="../html/imprint.html">Legal Notice</a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
