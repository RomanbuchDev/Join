<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join - Login</title>
    <link rel="icon" href="./assets/icons/join-logo.svg" />
    <!-- login links -->
    <link rel="stylesheet" href="./css/dpf-flex-utils.css" />

    <link rel="stylesheet" href="./css/reset_stylesheet.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/summary.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./style.css" />

    <script src="./script.js" defer></script>
    <script src="./js/template.js" defer></script>
    <script src="./js/contact.js" defer></script>
  </head>
  <body class="">
    <section class="app dpf-column-spc-between-center">
      <header class="">
        <div class="dpf-flex-start">
          <img src="./assets/icons/join-logo.png" alt="" />
        </div>
      </header>

      <section class="main-login">
        <form class="dpf-column-spc-between-center">
          <div class="heading-accent heading-accent--bottom-center">
            <h1>LOGIN</h1>
          </div>

          <div class="pb-1">
            <label for="exampleInputEmail1" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="email"
                placeholder="Email"
                class="form-control"
                id="exampleInputEmail1"
                aria-describedby="emailHelp"
              />
              <img src="./assets/icons/mail.png" class="input-icon" alt="" />
            </div>
            <div id="emailHelp" class="form-text">
              <!-- We'll never share your email with anyone else. -->
            </div>
            <label for="exampleInputPassword1" class="form-label"></label>
            <div class="input-wrapper">
              <input
                type="password"
                placeholder="Password"
                class="form-control"
                id="exampleInputPassword1"
              />
              <img src="./assets/icons/lock.png" class="input-icon" alt="" />
            </div>
          </div>

          <div class="btn-logins-bar dpf-column-spc-between-center">
            <button type="submit" class="btn btn-primary">Login</button>
            <button type="submit" class="btn btn-secondary">Guest Login</button>
            <!-- <a href="./html/summary.html" target="_blank">summary</a> -->
          </div>
        </form>
      </section>

      <footer class="dpf-flex-column-center footer-login">
        <section class="sign-up-bar dpf-spc-between-center">
          <p>Not a Join user?</p>
          <div class="dpf-center btn btn-primary" style="width: 104px">
            <a href="./html/signup.html" class="btn-primary">Sign up</a>
          </div>
        </section>
        <section class="dpf-center impress-bar">
          <a href="./html/privacy-policy.html" target="_blank" class="login-a"
            >Privacy Policy</a
          >
          <a href="./html/impressum.html" target="_blank" class="login-a"
            >Legal notice</a
          >
        </section>
        <div></div>
      </footer>
    </section>
  </body>
</html>
