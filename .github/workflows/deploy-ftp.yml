# Deploy to FTP/FTPS using SamKirkland/FTP-Deploy-Action
name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@6.0.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21                # optional, Standard 21
          protocol: ftps          # 'ftp' oder 'ftps' (empfohlen: ftps)
          local-dir: ./           # lokales Verzeichnis, das hochgeladen wird
          server-dir: /           # Remote-Zielverzeichnis
          exclude:
            .git*
            .github/**
            node_modules/**
            quality/**
            package.json
            package-lock.json